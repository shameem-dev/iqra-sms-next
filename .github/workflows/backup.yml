name: Supabase JSON Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - name: Backup Tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir -p backup

          TABLES=(
            account_profiles
            attendance
            category_summary
            courses
            fee_payments
            marks
            monthly_summary
            profiles
            result_status
            school_holidays
            staff
            staff_documents
            staff_leave
            staff_payroll
            staff_projects
            staff_salaries
            student_fee
            student_marks
            students
            subjects
            teacher_assignments
          )

          for table in "${TABLES[@]}"
          do
            echo "Backing up $table..."

            curl --fail \
              "$SUPABASE_URL/rest/v1/$table?select=*" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "Accept: application/json" \
              -o "backup/$table.json"
          done

          zip -r supabase-backup.zip backup

      - name: Upload Backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-json-backup
          path: supabase-backup.zip
